<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Delulu Commission</title>
<meta name="description" content="Live2D rigging and VTuber model commissions by Delulu Commission.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Nunito:wght@500;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#fff; --paper:#fff; --ink:#1a0d33; --cream:#f6f1ff;
  --purple:#6d3fc0; --accent:#6d3fc0; --line:#a77df0; --bd:#e6dafa; --shadow:#4b2a94; --soft:#e3d6fa;
  --white:#fff; --gold:#ffb703; --gx:32px; color-scheme:light;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (min-width:700px){:root{--gx:48px}}

*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px);scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--ink);font:500 17px/1.6 Nunito,system-ui,sans-serif;overflow-x:hidden;
  background-image:linear-gradient(135deg,rgba(109,63,192,.035) 25%,transparent 25%),linear-gradient(225deg,rgba(109,63,192,.035) 25%,transparent 25%);
  background-size:64px 64px}
body::after{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--paper);z-index:4}
h1,h2,h3{font-family:"Lilita One",Nunito,sans-serif;font-weight:400;line-height:1.05;margin:0}
a{color:inherit}
:focus-visible{outline:3px solid var(--accent);outline-offset:3px}
main,footer{position:relative;z-index:1}

/* decorative layers */
.harl{position:relative;overflow:hidden;background:var(--white)}
.harl::before{content:"";position:absolute;inset:-100%;background:repeating-conic-gradient(var(--purple) 0 25%,var(--white) 0 50%) 0 0/64px 64px;transform:rotate(45deg) scale(.7)}
.edge{position:fixed;inset:0 auto 0 0;width:20px;z-index:3}
.magic{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden;color:var(--accent)}
.magic svg{position:absolute;left:50%;top:50%;width:min(130vmin,1000px);aspect-ratio:1;translate:-50% -50%;opacity:.08;animation:spin 90s linear infinite}
#fx{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:9}
@keyframes spin{to{rotate:360deg}}

/* header and navigation */
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;display:flex;align-items:center;justify-content:space-between;gap:16px;
  padding:10px max(var(--gx),calc((100vw - 1080px)/2 + var(--gx)));background:var(--paper);border-bottom:5px dotted var(--line)}
.brand{font:400 1.5rem "Lilita One";color:var(--accent);text-decoration:none}
.brand::before{content:"✦ ";color:var(--gold)}
nav{display:flex;align-items:center;gap:18px;font-weight:800}
nav a{color:var(--accent);text-decoration:none}
nav a:not(.btn):hover{text-decoration:underline}
nav a[aria-current="page"]{text-decoration:underline;text-decoration-thickness:3px;text-underline-offset:6px}
.menu{display:none;font:400 1.05rem "Lilita One";background:var(--purple);color:var(--white);border:0;border-radius:10px;padding:8px 16px;cursor:pointer}
@media (max-width:700px){
  .menu{display:block}
  nav{display:none;position:absolute;top:100%;left:0;right:0;flex-direction:column;align-items:flex-start;gap:14px;padding:16px var(--gx) 20px;background:var(--paper);border-bottom:5px dotted var(--line)}
  header.open nav{display:flex}
}

/* layout */
.wrap{max-width:1080px;margin:0 auto;padding:0 var(--gx)}
section{padding:56px 0}
.after{padding-bottom:56px}
.sec-h{font-size:clamp(2rem,5vw,3rem);color:var(--ink);margin-bottom:8px}
.sec-h::after{content:"";display:block;width:56px;height:6px;margin-top:10px;background:var(--purple);border-radius:3px}
.sec-sub{margin:0 0 28px;max-width:56ch;font-weight:700}

/* shared pieces */
.btn{display:inline-block;background:var(--purple);color:var(--white);font:400 1.15rem "Lilita One";padding:12px 26px;border:3px solid var(--white);border-radius:14px;box-shadow:0 5px 0 var(--shadow);text-align:center;text-decoration:none;transition:transform .12s}
.btn:hover{transform:translateY(2px);box-shadow:0 3px 0 var(--shadow)}
.btn.sm{font-size:1rem;padding:6px 16px;box-shadow:0 3px 0 var(--shadow)}
.badge{display:inline-flex;align-items:center;gap:8px;margin-bottom:18px;padding:6px 16px 6px 12px;background:var(--purple);color:var(--white);border-radius:99px;font-weight:800}
.dot{width:12px;height:12px;border-radius:50%;background:#5ee08a}
.badge.closed .dot{background:#ff6b6b}
.tag{display:inline-block;padding:2px 12px;background:var(--purple);color:var(--white);border-radius:99px;font-size:.85rem;font-weight:800}
.soon{margin:28px 0 0;font-weight:700}
.note{font-size:.92rem;opacity:.85}
.prices{list-style:none;margin:4px 0 0;padding:0;display:grid;gap:8px}
.prices li{display:flex;justify-content:space-between;align-items:baseline;gap:12px;padding:8px 14px;background:var(--cream);border-radius:12px;font-weight:800}
.prices b,.from b{font:400 1.25rem "Lilita One";color:var(--accent)}

/* sticker frames, cards, panels: one outline + one hard shadow */
.card,.panel,.steps li,.cta,.sticker{border:4px solid var(--bd);box-shadow:6px 6px 0 var(--soft)}
.card,.panel,.steps li,.cta{background:var(--paper);color:var(--ink)}
.sticker{border-radius:20px;overflow:hidden;background:var(--paper);transform:rotate(var(--r,1.5deg))}
.sticker img{display:block;width:100%;aspect-ratio:16/9;object-fit:cover}
.card,.steps li,.gallery figure{transform:rotate(var(--r,0deg))}
:is(.card,.steps li,.gallery figure):nth-child(odd){--r:-1.8deg}
:is(.card,.steps li,.gallery figure):nth-child(even){--r:1.6deg}
@media (max-width:640px){
  :is(.card,.steps li,.gallery figure):nth-child(odd){--r:-1deg}
  :is(.card,.steps li,.gallery figure):nth-child(even){--r:1deg}
}

/* commission cards */
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(290px,1fr));gap:28px}
.card{display:flex;flex-direction:column;border-radius:22px;overflow:hidden}
.card img{display:block;width:100%;aspect-ratio:16/9;object-fit:cover;border-bottom:4px solid var(--bd)}
.card-b{display:flex;flex-direction:column;gap:12px;flex:1;padding:18px 20px 22px}
.card h3{font-size:1.7rem;color:var(--accent)}
.card p{margin:0}
.card .btn{margin-top:auto;font-size:1.05rem}

/* detail page */
.detail{display:grid;grid-template-columns:1.1fr 1fr;gap:32px;align-items:start;padding:48px 0 56px}
.detail .sticker,.detail .sticker img{transition:transform .15s ease-out}
.detail .sticker img{transform:scale(1.04)}
.panel{display:grid;gap:14px;padding:22px;border-radius:22px;transform:rotate(-1deg)}
.panel h2,.panel h3{color:var(--accent)}
.panel h2{font-size:2rem}
.panel h3{font-size:1.3rem}
.panel p,.panel ul{margin:0}
.incl{padding-left:20px}
@media (max-width:820px){.detail{grid-template-columns:1fr}}
@media (max-width:640px){.panel{transform:none}}

/* showcase */
.gallery{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:24px}
.gallery figure{margin:0}
.gallery figcaption{padding:8px 14px;background:var(--paper);color:var(--ink);font-weight:800}
.gallery figcaption a{color:var(--accent)}
.vid{display:grid;place-items:center;aspect-ratio:16/9;background:#000;color:var(--white);font-weight:800}
.vid iframe{display:block;width:100%;height:100%;border:0}

/* how to order and closing call to action */
.steps{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:18px;margin:0;padding:0;list-style:none;counter-reset:s}
.steps li{counter-increment:s;padding:16px 18px;border-radius:18px}
.steps li::before{content:counter(s);display:grid;place-items:center;width:36px;height:36px;margin-bottom:8px;background:var(--purple);color:var(--white);border-radius:50%;font:400 1.2rem "Lilita One"}
.steps b{display:block;font-size:1.1rem}
.cta{padding:32px;border-radius:24px;text-align:center}
.cta h2{margin-bottom:10px;font-size:2.2rem;color:var(--accent)}

/* footer */
footer{padding:0 var(--gx) 40px;text-align:center;font-weight:700}
.strip{margin:0 calc(var(--gx) * -1) 18px;padding:12px var(--gx);background:var(--cream)}

@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important;scroll-behavior:auto!important}}
</style>
</head>
<body>
<div class="magic" aria-hidden="true"><svg viewBox="0 0 200 200" fill="none" stroke="currentColor" stroke-width=".8"><circle cx="100" cy="100" r="96"/><circle cx="100" cy="100" r="88" stroke-dasharray="2 4"/><circle cx="100" cy="100" r="70"/><path d="M100 30L160.6 135H39.4ZM100 170L39.4 65H160.6Z"/><circle cx="100" cy="100" r="30"/></svg></div>
<canvas id="fx" aria-hidden="true"></canvas>
<div class="edge harl" aria-hidden="true"></div>
<header id="hdr">
  <a class="brand" href="#commission">Delulu Commission</a>
  <button class="menu" id="menuBtn" aria-expanded="false" aria-controls="nav">Menu</button>
  <nav id="nav" aria-label="Main"></nav>
</header>
<main id="app"></main>
<footer>
  <div class="strip" id="strip"><a class="btn sm" href="#commission">← Back to commission</a></div>
  © <span id="yr"></span> Delulu Commission · <a id="footX" target="_blank" rel="noopener">@delulumiluu</a>
</footer>

<script>
/* ============ EDIT HERE ============
   Thumbnails: set any `thumb` to a key from THUMBS (end of file).
   Services: each entry below becomes a card and its own page (route = id). */
const CONFIG = {
  x: "https://x.com/delulumiluu",
  kofi: "https://ko-fi.com/delulumilu/commissions?commissionAlias=1591c639b5#buyShopCommissionModal",
  status: { open: true, text: "Commissions open" },
  /* Showcase slots. type "youtube": src = YouTube link. type "gif": src = key from THUMBS (GIFs must be embedded; remote image links are blocked). */
  showcase: [
    { title: "Portfolio 1", type: "gif", src: "main" },
    { title: "Portfolio 2", type: "gif", src: "main" },
    { title: "Portfolio 3", type: "gif", src: "main" },
    { title: "Portfolio 4", type: "gif", src: "main" },
    { title: "Portfolio 5", type: "gif", src: "main" }
  ],
  services: [
    { id: "vtuber-model", title: "VTuber Model", thumb: "main", position: "center",
      short: "A full model made for you: illustration plus Live2D rigging.",
      long: "A complete model made for you, with illustration and Live2D rigging in one commission, ready for streaming.",
      prices: [["Bust up", "$200"], ["Half body", "$235"], ["Full body", "$300"]],
      note: "", included: [], request: "https://ko-fi.com/c/f3d971efe6" },
    { id: "rigging-only", title: "Live2D Rigging Only", thumb: "main", position: "center",
      short: "Already have your art? Send it and I’ll rig it.",
      long: "Already have your character art? Send your layered file and I’ll turn it into a Live2D model.",
      prices: [["Bust up & half body", "$235"], ["Full body", "$350"], ["VBridger", "$200"]],
      note: "", included: [] },
    { id: "ych-haunted-paws", title: "YCH Haunted Paws", thumb: "main", position: "center",
      short: "A themed Your Character Here slot.",
      long: "A themed Your Character Here (YCH) slot with the Haunted Paws concept.",
      prices: [["Per slot", "$95"]],
      note: "Slot count and deadline: to be announced.", included: [], request: "https://ko-fi.com/c/85a37a3ef6" }
  ]
};
/* =================================== */
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const img = k => (typeof THUMBS !== "undefined" && THUMBS[k]) || k;
const xbtn = (t, c = "") => `<a class="btn ${c}" href="${esc(CONFIG.x)}" target="_blank" rel="noopener">${esc(t)}</a>`;
const fromPrice = s => "$" + Math.min(...s.prices.map(p => +p[1].replace(/\D/g, "")));
const picture = (s, alt) => `<img src="${esc(img(s.thumb))}" alt="${esc(alt)}" style="object-position:${esc(s.position || "center")}">`;
const card = s => `<article class="card">${picture(s, s.title + " preview")}<div class="card-b"><h3>${esc(s.title)}</h3><p>${esc(s.short)}</p><p class="from">${s.prices.length > 1 ? "From" : "Price"} <b>${fromPrice(s)}</b></p><a class="btn" href="#${s.id}">View details</a></div></article>`;
const cta = () => `<div class="cta"><h2>Ready to bring your model to life?</h2><p>Send your character reference and the service you want.</p>${xbtn("DM on X")}</div>`;
const ytId = u => (String(u || "").match(/(?:youtu\.be\/|v=|embed\/|shorts\/)([\w-]{11})/) || [])[1] || (/^[\w-]{11}$/.test(u || "") ? u : "");
const media = i => i.type === "youtube"
  ? (ytId(i.src) ? `<div class="vid"><iframe src="https://www.youtube-nocookie.com/embed/${ytId(i.src)}" title="${esc(i.title)}" loading="lazy" allow="encrypted-media; picture-in-picture" allowfullscreen referrerpolicy="strict-origin-when-cross-origin"></iframe></div>` : `<div class="vid">Add a YouTube link in CONFIG</div>`)
  : `<img src="${esc(img(i.src))}" alt="${esc(i.title)}">`;
const showItem = i => `<figure class="sticker">${media(i)}<figcaption>${esc(i.title)}${i.type === "youtube" && ytId(i.src) ? ` · <a href="https://youtu.be/${ytId(i.src)}" target="_blank" rel="noopener">Watch on YouTube</a>` : ""}</figcaption></figure>`;
const NAV = [["commission", "Commission"], ["showcase", "Showcase"], ["order", "How to order"]];

const PAGES = {
  commission: () => ({ title: "Delulu Commission · Live2D Rigging & VTuber Models", nav: "commission", html: `
    <div class="wrap"><section>
      <div class="badge${CONFIG.status.open ? "" : " closed"}"><span class="dot"></span>${esc(CONFIG.status.text)}</div>
      <h2 class="sec-h">Commission</h2>
      <p class="sec-sub">Live2D rigging and VTuber models. All prices are in USD.</p>
      <div class="cards">${CONFIG.services.map(s => card(s)).join("")}</div>
    </section></div>` }),
  showcase: () => ({ title: "Showcase · Delulu Commission", nav: "showcase", html: `
    <div class="wrap"><section>
      <h2 class="sec-h">Showcase</h2>
      <p class="sec-sub">A look at finished models.</p>
      <div class="gallery">${CONFIG.showcase.map(showItem).join("")}</div>
    </section></div>` }),
  order: () => ({ title: "How to order · Delulu Commission", nav: "order", html: `
    <div class="wrap"><section>
      <h2 class="sec-h">How to order</h2>
      <p class="sec-sub">Orders start with a DM on X.</p>
      <ol class="steps">
        <li><b>Send a DM</b>Message me on X with your service, model type and references.</li>
        <li><b>Review &amp; quote</b>I check your art and confirm the final price.</li>
        <li><b>Agree &amp; pay</b>We confirm the terms and payment before work begins.</li>
        <li><b>Delivery</b>You get the finished model.</li>
      </ol>
      <p class="soon"><span class="tag">Coming soon</span> Terms of service and payment details will be added here.</p>
    </section>
    <div class="after">${cta()}</div></div>` })
};
const detail = s => ({ title: s.title + " · Delulu Commission", nav: "commission", html: `
  <div class="wrap">
    <div class="detail">
      <div class="sticker">${picture(s, s.title + " preview")}</div>
      <div class="panel">
        <h2>${esc(s.title)}</h2>
        <p>${esc(s.long)}</p>
        <h3>Prices (USD)</h3>
        <ul class="prices">${s.prices.map(p => `<li><span>${esc(p[0])}</span><b>${esc(p[1])}</b></li>`).join("")}</ul>
        ${s.note ? `<p class="note">${esc(s.note)}</p>` : ""}
        <h3>What’s included</h3>
        ${s.included.length ? `<ul class="incl">${s.included.map(i => `<li>${esc(i)}</li>`).join("")}</ul>` : `<p><span class="tag">Coming soon</span> Package details will be added here.</p>`}
        <a class="btn" href="${esc(s.request || CONFIG.kofi)}" target="_blank" rel="noopener">Request</a>
      </div>
    </div>
  </div>` });

const hdr = document.getElementById("hdr"), menuBtn = document.getElementById("menuBtn");
function route() {
  const id = location.hash.slice(1) || "commission";
  const s = CONFIG.services.find(v => v.id === id);
  const p = s ? detail(s) : (PAGES[id] || PAGES.commission)();
  document.getElementById("app").innerHTML = p.html;
  document.title = p.title;
  document.getElementById("strip").hidden = p.nav === "commission" && !s;
  document.getElementById("nav").innerHTML = NAV.map(n => `<a href="#${n[0]}"${n[0] === p.nav ? ' aria-current="page"' : ""}>${n[1]}</a>`).join("") + xbtn("DM on X", "sm");
  hdr.classList.remove("open"); menuBtn.setAttribute("aria-expanded", "false");
  scrollTo(0, 0);
}
menuBtn.addEventListener("click", () => menuBtn.setAttribute("aria-expanded", hdr.classList.toggle("open")));
/* Magic FX: small sparkle burst on click */
(function () {
  if (matchMedia("(prefers-reduced-motion:reduce)").matches) return;
  const cv = document.getElementById("fx"), cx = cv.getContext("2d"), cols = ["#8a5cf0", "#ffb703", "#b98cff", "#ff7ad9"];
  let ps = [], run = false;
  const size = () => { const d = devicePixelRatio || 1; cv.width = innerWidth * d; cv.height = innerHeight * d; cx.setTransform(d, 0, 0, d, 0, 0); };
  size(); addEventListener("resize", size);
  function tick() {
    cx.clearRect(0, 0, innerWidth, innerHeight);
    ps = ps.filter(p => p.l > 0);
    for (const p of ps) {
      p.x += p.vx; p.y += p.vy; p.vy += .08; p.l -= .02; p.r += .05;
      cx.save(); cx.translate(p.x, p.y); cx.rotate(p.r); cx.globalAlpha = Math.max(p.l, 0); cx.fillStyle = p.c; cx.beginPath();
      for (let i = 0; i < 8; i++) { const a = i * Math.PI / 4, r = i % 2 ? p.s * .25 : p.s; cx.lineTo(Math.cos(a) * r, Math.sin(a) * r); }
      cx.fill(); cx.restore();
    }
    if (ps.length) requestAnimationFrame(tick); else run = false;
  }
  function burst(x, y, n, sp) {
    for (let i = 0; i < n; i++) ps.push({ x, y, vx: (Math.random() - .5) * sp, vy: (Math.random() - .8) * sp, l: 1, s: 5 + Math.random() * 8, r: Math.random() * 6, c: cols[Math.random() * 4 | 0] });
    if (!run) { run = true; requestAnimationFrame(tick); }
  }
  addEventListener("pointerdown", e => burst(e.clientX, e.clientY, 8, 5));
})();
const FOLLOW = matchMedia("(pointer:fine) and (prefers-reduced-motion:no-preference)").matches;
function follow(x, y) {
  const st = document.querySelector(".detail .sticker");
  if (!st) return;
  st.style.transform = x === null ? "" : `perspective(900px) rotateY(${x * 4}deg) rotateX(${-y * 4}deg) rotate(1.5deg)`;
  st.firstElementChild.style.transform = x === null ? "" : `translate(${-x * 10}px,${-y * 10}px) scale(1.04)`;
}
if (FOLLOW) {
  addEventListener("pointermove", e => follow(e.clientX / innerWidth - .5, e.clientY / innerHeight - .5));
  document.addEventListener("mouseleave", () => follow(null));
}
addEventListener("hashchange", route);
addEventListener("DOMContentLoaded", () => {
  document.getElementById("footX").href = CONFIG.x;
  document.getElementById("yr").textContent = new Date().getFullYear();
  route();
});
